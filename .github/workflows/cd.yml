name: CD

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run tests before deploying
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Backend build + test
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet test tests/Portfolio.UnitTests --no-build --configuration Release
          dotnet test tests/Portfolio.IntegrationTests --no-build --configuration Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint + test + build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

  deploy:
    name: Trigger Render deploys
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy API
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Deploy frontend
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
